<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625@N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    // Flickr calls this global function name when loading the public feed json format
    function jsonFlickrFeed(data) {
      if (data && data.items && data.items.length > 0) {
        // Pick a completely random photo object from the feed items
        var randomItem = data.items[Math.floor(Math.random() * data.items.length)];
        // The feed returns the individual photo page URL in item.link
        var destination = randomItem.link;
        
        document.getElementById('fallback-link').href = destination;
        window.location.replace(destination);
      } else {
        // Fallback to main photostream if feed is empty
        window.location.replace("https://www.flickr.com/photos/185082625@N02/");
      }
    }

    (function() {
      // Fetch your public feed dynamically using JSONP to bypass CORS restrictions
      var script = document.createElement('script');
      script.src = "https://api.flickr.com/services/feeds/photos_public.gne?id=185082625@N02&format=json";
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
