<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>

  <script type="text/javascript">
    (function() {
      var searchTokens = [
        "p", "img", "dsc", "dcim", "dscn", "pict",
        "å", "ä", "ö",
        "film", "det",
        "a", "e", "i", "o", "u",
        "_",
        "1", "2", "3", "4", "5", "6", "7", "8", "9"
      ];
      
      var randomToken = searchTokens[Math.floor(Math.random() * searchTokens.length)];
      var randomSeed = Math.floor(Math.random() * 9999999);
      
      var destination = "https://www.flickr.com/search/?" +
        "user_id=185082625%40N02" +
        "&text=" + encodeURIComponent(randomToken) +
        "&sort=interestingness-desc" +
        "&page=1" +
        "&view_all=1" +
        "&_s=" + randomSeed;

      // Append the fallback link safely via JS so there's only one line of text plus the link
      var link = document.createElement('a');
      link.href = destination;
      link.innerText = "Click here if you are not redirected automatically.";
      document.body.appendChild(link);

      // Redirect after 1 second
      setTimeout(function() {
        window.location.replace(destination);
      }, 1000);
    })();
  </script>
</body>
</html>
