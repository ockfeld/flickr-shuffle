<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ockfeld archive // photo shuffle</title>
  <style>
    /* Silent, minimal dark canvas during the micro-second load */
    html, body {
      background-color: #0d0d0d;
      color: #333333;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      letter-spacing: 1px;
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>

  <script type="text/javascript">
    (function() {
      // The exact high-coverage token pool from your proven Blogger gadget
      var searchTokens = [
        // Camera & File Prefixes (Focusing on PXXXXXX sequences)
        "p", "img", "dsc", "dcim", "dscn", "pict",
        // Swedish Accented Characters
        "å", "ä", "ö",
        // General media terms
        "film", "det",
        // Vowels & single characters
        "a", "e", "i", "o", "u",
        // Symbols & Separators
        "_",
        // Single-digit numbers only (zero-free)
        "1", "2", "3", "4", "5", "6", "7", "8", "9"
      ];

      // Pick random token
      var randomToken = searchTokens[Math.floor(Math.random() * searchTokens.length)];
      
      // High-entropy cache-busting seed
      var randomSeed = Math.floor(Math.random() * 9999999);

      // Construct error-free search URL
      var destination = "https://www.flickr.com/search/?" +
        "user_id=185082625%40N02" +
        "&text=" + encodeURIComponent(randomToken) +
        "&sort=interestingness-desc" +
        "&page=1" +
        "&view_all=1" +
        "&_s=" + randomSeed;

      // Execute immediate browser-native redirect (0ms delay)
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <div>[ SHUFFLING ARCHIVE... ]</div>
</body>
</html>
