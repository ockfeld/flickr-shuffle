<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    /* Industrial dark-mode aesthetic */
    body {
      background-color: #0d0d0d;
      color: #aeaeae;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    a {
      color: #ffffff;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div>[ SHUFFLING PHOTO ARCHIVE... ]</div>

  <script type="text/javascript">
    (function() {
      // Cleaned token pool for photo searches
      var searchTokens = [
        "p", "img", "dsc", "dcim", "dscn", "pict",
        "å", "ä", "ö",
        "film", "det",
        "a", "e", "i", "o", "u",
        "_",
        "1", "2", "3", "4", "5", "6", "7", "8", "9"
      ];
      
      var randomToken = searchTokens[Math.floor(Math.random() * searchTokens.length)];
      var randomSeed = Math.floor(Math.random() * 9999999);
      
      var destination = "https://www.flickr.com/search/?" +
        "user_id=185082625%40N02" +
        "&text=" + encodeURIComponent(randomToken) +
        "&sort=interestingness-desc" +
        "&page=1" +
        "&view_all=1" +
        "&_s=" + randomSeed;

      // Fallback link in case redirect is delayed or blocked
      document.write('<a href="' + destination + '">Click here if you are not redirected automatically.</a>');

      // Wait 1.5 seconds before redirecting so the splash screen is readable
      setTimeout(function() {
        window.location.replace(destination);
      }, 1500);
    })();
  </script>
</body>
</html>
