<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flickr Archive Shuffler</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #status {
      color: #ffffff;
      margin-bottom: 10px;
    }
    #details {
      color: #55ff55;
      max-width: 600px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="status">[ STATUS: INITIALIZING SCRIPT... ]</div>
  <div id="details"></div>

  <script type="text/javascript">
    (async function() {
      const apiKey = "YOUR_FLICKR_API_KEY_HERE"; // <-- Paste your API key here
      const userId = "185082625@N02";
      const perPage = 250;
      const statusEl = document.getElementById('status');
      const detailsEl = document.getElementById('details');

      try {
        // Unique timestamp to force bypass of all caches
        const cacheBuster = "&_t=" + Date.now();

        statusEl.innerText = "[ STATUS: CONNECTING TO FLICKR API... ]";
        
        const url = `https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&api_key=${apiKey}&user_id=${userId}&per_page=${perPage}&page=1&format=json&nojsoncallback=1${cacheBuster}`;
        
        const res = await fetch(url);
        const data = await res.json();

        if (data.stat !== "ok") {
          throw new Error("Flickr API Error: " + (data.message || JSON.stringify(data)));
        }

        const totalPages = data.photos.pages;
        const totalPhotos = data.photos.total;

        statusEl.innerText = `[ STATUS: ARCHIVE FOUND (${totalPhotos} PHOTOS / ${totalPages} PAGES) ]`;

        // Pick a truly random page across the entire archive history
        const randomPage = Math.floor(Math.random() * totalPages) + 1;
        detailsEl.innerText = `Selected random page ${randomPage} out of ${totalPages}. Fetching...`;

        // Fetch that specific random page
        const pageUrl = `https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&api_key=${apiKey}&user_id=${userId}&per_page=${perPage}&page=${randomPage}&format=json&nojsoncallback=1${cacheBuster}`;
        
        const pageRes = await fetch(pageUrl);
        const pageData = await pageRes.json();

        if (pageData.stat !== "ok" || !pageData.photos.photo.length) {
          throw new Error("Failed to fetch photos from random page " + randomPage);
        }

        const photos = pageData.photos.photo;
        const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
        const photoUrl = `https://www.flickr.com/photos/${userId}/${randomPhoto.id}/`;

        statusEl.innerText = `[ STATUS: SUCCESS! REDIRECTING... ]`;
        detailsEl.innerText = `Target Photo ID: ${randomPhoto.id} (Page ${randomPage})`;

        // Small delay so you can see it worked before jumping
        setTimeout(function() {
          window.location.replace(photoUrl);
        }, 800);

      } catch (err) {
        console.error(err);
        statusEl.innerText = "[ STATUS: ERROR ENCOUNTERED ]";
        detailsEl.style.color = "#ff5555";
        detailsEl.innerText = err.message;
      }
    })();
  </script>
</body>
</html>
