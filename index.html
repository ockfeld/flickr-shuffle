<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flickr Archive Shuffler</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #status {
      color: #ffffff;
      margin-bottom: 10px;
    }
    #details {
      color: #55ff55;
      max-width: 600px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="status">[ CONNECTING VIA JSONP... ]</div>
  <div id="details"></div>

  <script type="text/javascript">
    (async function() {
      const apiKey = "YOUR_FLICKR_API_KEY_HERE"; // <-- Paste your API key here
      const userId = "185082625@N02";
      const perPage = 250;
      const statusEl = document.getElementById('status');
      const detailsEl = document.getElementById('details');

      // Helper function for JSONP to bypass Flickr's CORS restriction on GitHub Pages
      function callFlickrJSONP(methodParams) {
        return new Promise((resolve, reject) => {
          const callbackName = 'flickr_cb_' + Math.random().toString(36).substring(2, 9);
          const script = document.createElement('script');
          
          window[callbackName] = function(data) {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            resolve(data);
          };

          script.onerror = function() {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            reject(new Error('JSONP script load error'));
          };

          script.src = `https://api.flickr.com/services/rest/?api_key=${apiKey}&format=json&jsoncallback=${callbackName}&${methodParams}`;
          document.body.appendChild(script);
        });
      }

      try {
        statusEl.innerText = "[ STATUS: FETCHING ARCHIVE METADATA... ]";
        
        // Step 1: Request page 1 to discover total pages and photos
        const initialData = await callFlickrJSONP(`method=flickr.people.getPublicPhotos&user_id=${userId}&per_page=${perPage}&page=1`);

        if (initialData.stat !== "ok") {
          throw new Error("Flickr API Error: " + (initialData.message || JSON.stringify(initialData)));
        }

        const totalPages = initialData.photos.pages;
        const totalPhotos = initialData.photos.total;

        statusEl.innerText = `[ ARCHIVE LOADED: ${totalPhotos} PHOTOS / ${totalPages} PAGES ]`;

        // Step 2: Pick a completely random page across your entire history
        const randomPage = Math.floor(Math.random() * totalPages) + 1;
        detailsEl.innerText = `Selected random page ${randomPage} of ${totalPages}. Fetching deep history...`;

        // Step 3: Fetch that specific random page via JSONP
        const pageData = await callFlickrJSONP(`method=flickr.people.getPublicPhotos&user_id=${userId}&per_page=${perPage}&page=${randomPage}`);

        if (pageData.stat !== "ok" || !pageData.photos.photo.length) {
          throw new Error("Failed to fetch photos from page " + randomPage);
        }

        const photos = pageData.photos.photo;
        const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
        const photoUrl = `https://www.flickr.com/photos/${userId}/${randomPhoto.id}/`;

        statusEl.innerText = `[ SUCCESS! REDIRECTING TO DEEP ARCHIVE... ]`;
        detailsEl.innerText = `Photo ID: ${randomPhoto.id} (Page ${randomPage})`;

        setTimeout(() => {
          window.location.replace(photoUrl);
        }, 700);

      } catch (err) {
        console.error(err);
        statusEl.innerText = "[ ERROR DETECTED ]";
        detailsEl.style.color = "#ff5555";
        detailsEl.innerText = err.message;
      }
    })();
  </script>
</body>
</html>
