<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625%40N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    (function() {
      // Define your archive's historical timeframe (adjust start year as needed)
      var startYear = 2018;
      var currentYear = 2026;
      
      // Pick a random year and month from your history
      var randomYear = Math.floor(Math.random() * (currentYear - startYear + 1)) + startYear;
      var randomMonth = Math.floor(Math.random() * 12) + 1;
      var monthStr = randomMonth < 10 ? '0' + randomMonth : '' + randomMonth;
      
      // Calculate days in that specific month to construct accurate date bounds
      var daysInMonth = new Date(randomYear, randomMonth, 0).getDate();
      
      // Format dates as YYYYMMDD for Flickr's server-side date range filter
      var dateFrom = randomYear + monthStr + "01";
      var dateTo = randomYear + monthStr + (daysInMonth < 10 ? '0' + daysInMonth : '' + daysInMonth);
      
      var randomSeed = Math.floor(Math.random() * 9999999);
      
      // Force Flickr's search engine to pull strictly from that random historical time window
      var destination = "https://www.flickr.com/search/?" +
        "user_id=185082625%40N02" +
        "&d=taken-" + dateFrom + "-" + dateTo +
        "&sort=interestingness-desc" +
        "&view_all=1" +
        "&_s=" + randomSeed;

      document.getElementById('fallback-link').href = destination;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
