<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <!-- Native browser meta refresh backup set to 1 second -->
  <meta http-equiv="refresh" content="1;url=https://www.flickr.com/search/?user_id=185082625%40N02&sort=interestingness-desc&page=1&view_all=1">
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div>[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="flickr-link" href="https://www.flickr.com/search/?user_id=185082625%40N02&sort=interestingness-desc&page=1&view_all=1">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    (function() {
      var searchTokens = [
        "p", "img", "dsc", "dcim", "dscn", "pict",
        "å", "ä", "ö",
        "film", "det",
        "a", "e", "i", "o", "u",
        "_",
        "1", "2", "3", "4", "5", "6", "7", "8", "9"
      ];
      
      var randomToken = searchTokens[Math.floor(Math.random() * searchTokens.length)];
      var randomSeed = Math.floor(Math.random() * 9999999);
      
      var destination = "https://www.flickr.com/search/?" +
        "user_id=185082625%40N02" +
        "&text=" + encodeURIComponent(randomToken) +
        "&sort=interestingness-desc" +
        "&page=1" +
        "&view_all=1" +
        "&_s=" + randomSeed;

      // Update the fallback link href
      document.getElementById('flickr-link').href = destination;

      // Update the meta refresh tag dynamically
      var metaRefresh = document.querySelector("meta[http-equiv='refresh']");
      if (metaRefresh) {
        metaRefresh.content = "1;url=" + destination;
      }

      // Fallback JS redirect just in case
      setTimeout(function() {
        window.location.replace(destination);
      }, 1000);
    })();
  </script>
</body>
</html>
