<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625@N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    (function() {
      // Your archive URL pool
      var archiveUrls = [
        "https://www.flickr.com/photos/185082625@N02/53000000000/", 
        "https://www.flickr.com/photos/185082625@N02/52000000000/", 
        "https://www.flickr.com/photos/185082625@N02/51000000000/"
      ];

      var defaultProfile = "https://www.flickr.com/photos/185082625@N02/";

      if (!archiveUrls || archiveUrls.length === 0) {
        window.location.replace(defaultProfile);
        return;
      }

      var randomDestination = archiveUrls[Math.floor(Math.random() * archiveUrls.length)];

      document.getElementById('fallback-link').href = randomDestination;

      // Optional: Uncomment the setTimeout below if you want a 400ms delay 
      // so the retro splash text is visible for a split second before redirecting.
      // setTimeout(function() {
        window.location.replace(randomDestination);
      // }, 400);
    })();
  </script>
</body>
</html>
