<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625%40N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    (function() {
      // Your complete archive link pool. Add as many photo URLs here as you like 
      // spanning your oldest to newest uploads for a true deep archive shuffle.
      var archiveUrls = [
        "https://www.flickr.com/photos/185082625%40N02/53000000000/", // Example URL 1
        "https://www.flickr.com/photos/185082625%40N02/53000000001/", // Example URL 2
        "https://www.flickr.com/photos/185082625%40N02/53000000002/"  // Example URL 3
        // Add more archive links here...
      ];

      // Fallback to main photostream if the array is empty
      if (!archiveUrls || archiveUrls.length === 0) {
        window.location.replace("https://www.flickr.com/photos/185082625%40N02/");
        return;
      }

      // Pick a completely random photo URL from your full archive array
      var randomDestination = archiveUrls[Math.floor(Math.random() * archiveUrls.length)];

      // Map to fallback link and execute instant redirect
      document.getElementById('fallback-link').href = randomDestination;
      window.location.replace(randomDestination);
    })();
  </script>
</body>
</html>
