<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .shuffle-btn-link {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      border: 1px solid #222222 !important;
      padding: 12px 24px !important;
      font-family: "Courier New", Courier, monospace !important;
      font-size: 13px !important;
      letter-spacing: 1px !important;
      text-transform: uppercase !important;
      text-decoration: none !important;
      text-align: center !important;
      cursor: pointer !important;
      border-radius: 0px !important;
      transition: all 0.15s ease-in-out !important;
    }
    .shuffle-btn-link:hover {
      background-color: #161616 !important;
      color: #ffffff !important;
      border-color: #444444 !important;
    }
  </style>
</head>
<body>
  <a class="shuffle-btn-link" href="https://www.flickr.com/photos/185082625@N02/" id="ockfeld-archive-shuffle" target="_blank">[ 🎲 SHUFFLE PHOTO ARCHIVE ]</a>

  <script type="text/javascript">
    (function() {
      var btn = document.getElementById('ockfeld-archive-shuffle');
      if (btn) {
        btn.onclick = function(e) {
          e.preventDefault();
          
          // Cleaned token pool without dcim, film, det, or dead-end digits
          var searchTokens = [
            "p", "pict", "img", "dsc", "dscn",
            "a", "e", "i", "o", "u"
          ];
          
          var randomToken = searchTokens[Math.floor(Math.random() * searchTokens.length)];
          var randomSeed = Math.floor(Math.random() * 9999999);
          
          var destination = "https://www.flickr.com/search/?" +
            "user_id=185082625%40N02" +
            "&text=" + encodeURIComponent(randomToken) +
            "&sort=interestingness-desc" +
            "&page=1" +
            "&view_all=1" +
            "&_s=" + randomSeed;
          
          window.location.href = destination;
        };
      }
    })();
  </script>
</body>
</html>
