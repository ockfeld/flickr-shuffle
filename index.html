<!DOCTYPE html>
<html lang="en" style="background-color: #0d0d0d !important; color-scheme: dark;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ockfeld archive // deep shuffle v6</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      letter-spacing: 1px;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .splash-card {
      border: 1px solid #222222;
      background-color: #0d0d0d;
      padding: 32px 48px;
      text-align: center;
      box-sizing: border-box;
    }
    .text-main {
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .text-sub {
      color: #444444;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <div class="text-main">[ PULLING ARCHIVE PHOTO... ]</div>
    <div class="text-sub">ockfeld portal // full-stream sweep</div>
  </div>

  <script type="text/javascript">
    (function() {
      // Rotate sort vectors to pull from oldest archive items, recent uploads, and top highlights
      var sortModes = [
        "interestingness-desc",
        "date-posted-asc",
        "date-posted-desc",
        "relevance"
      ];

      var randomSort = sortModes[Math.floor(Math.random() * sortModes.length)];
      
      // Safe deep pagination range (1 to 100) spanning your entire 5000+ photo stream 
      // without exceeding result boundaries or causing empty pages.
      var randomPage = Math.floor(Math.random() * 100) + 1; 
      var randomSeed = Math.floor(Math.random() * 999999999);

      // Query the full stream directly without restrictive text bottlenecks
      var destination = "https://www.flickr.com/search/?" +
        "user_id=185082625%40N02" +
        "&sort=" + randomSort +
        "&page=" + randomPage +
        "&view_all=1" +
        "&_s=" + randomSeed;

      requestAnimationFrame(function() {
        window.location.replace(destination);
      });
    })();
  </script>

</body>
</html>
