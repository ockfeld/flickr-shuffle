<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625%40N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    (function() {
      // Define your archive's active year span (adjust start year as needed)
      var startYear = 2020;
      var endYear = 2026;
      
      var randomYear = Math.floor(Math.random() * (endYear - startYear + 1)) + startYear;
      var randomMonth = Math.floor(Math.random() * 12) + 1;
      
      // Ensure month is two digits (e.g., '03' instead of '3')
      var monthStr = randomMonth < 10 ? '0' + randomMonth : '' + randomMonth;
      
      // Target Flickr's date-taken archive structure for a deep historical slice
      var destination = "https://www.flickr.com/photos/185082625%40N02/archives/date-taken/" + randomYear + "/" + monthStr + "/";

      document.getElementById('fallback-link').href = destination;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
