<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ockfeld archive // photo shuffle</title>
  <style>
    /* Prevent white flash by forcing background color at the highest priority before page load */
    html {
      background-color: #0d0d0d !important;
      color-scheme: dark;
    }
    body {
      background-color: #0d0d0d !important;
      color: #aeaeae;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .splash-card {
      max-width: 440px;
      width: 100%;
      border: 1px solid #222222;
      background-color: #0d0d0d;
      padding: 32px 24px;
      text-align: center;
    }
    .status-text {
      color: #ffffff;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .sub-text {
      color: #444444;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <div class="status-text">[ PULLING RANDOM PHOTO... ]</div>
    <div class="sub-text">ockfeld archive // zero-radius portal</div>
  </div>

  <script type="text/javascript">
    // JSONP callback for Flickr public feed
    window.jsonFlickrFeed = function(data) {
      if (data && data.items && data.items.length > 0) {
        // Pick a random single photo directly from your stream feed
        var randomItem = data.items[Math.floor(Math.random() * data.items.length)];
        // Navigate straight to the single photo URL (e.g., /photos/185082625@N02/49588834758/)
        window.location.replace(randomItem.link);
      } else {
        window.location.replace("https://www.flickr.com/photos/185082625@N02/");
      }
    };

    // Execute feed fetch after the DOM renders the dark splash screen
    window.addEventListener("DOMContentLoaded", function() {
      var script = document.createElement('script');
      // Append timestamp cache-buster to force fresh photo feed on every single click
      script.src = "https://www.flickr.com/services/feeds/photos_public.gne?id=185082625@N02&format=json&_cb=" + new Date().getTime();
      document.head.appendChild(script);
    });
  </script>

</body>
</html>
