<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flickr Archive Shuffler</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #status {
      color: #55ff55;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="status">[ SHUFFLING ARCHIVE... ]</div>

  <script type="text/javascript">
    const apiKey = "8f55184af0567074bc4fff8e78c66f7f";
    const userId = "185082625@N02";
    const perPage = 250;
    const statusEl = document.getElementById('status');

    // Global callback required by Flickr JSONP
    window.jsonFlickrApi = function(data) {
      try {
        if (data.stat !== "ok") {
          throw new Error("API Error: " + (data.message || "Unknown error"));
        }

        const totalPages = data.photos.pages;
        const totalPhotos = data.photos.total;

        // If we just received page 1, now pick a random page and fetch it
        if (!window.randomPhaseDone) {
          window.randomPhaseDone = true;
          const randomPage = Math.floor(Math.random() * totalPages) + 1;
          statusEl.innerText = `[ JUMPING TO PAGE ${randomPage} OF ${totalPages}... ]`;

          // Inject second script tag for the randomized deep page
          const script2 = document.createElement('script');
          script2.src = `https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&api_key=${apiKey}&user_id=${userId}&per_page=${perPage}&page=${randomPage}&format=json`;
          document.body.appendChild(script2);
          return;
        }

        // We have received the random page batch, pick a photo and redirect
        const photos = data.photos.photo;
        if (!photos || photos.length === 0) {
          throw new Error("No photos found on target page");
        }

        const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
        const photoUrl = `https://www.flickr.com/photos/${userId}/${randomPhoto.id}/`;

        statusEl.innerText = "[ SUCCESS! REDIRECTING... ]";
        window.location.replace(photoUrl);

      } catch (err) {
        console.error(err);
        statusEl.innerText = "[ ERROR: " + err.message + " ]";
        statusEl.style.color = "#ff5555";
      }
    };

    // Kick off the initial request for page 1 metadata
    const script1 = document.createElement('script');
    script1.src = `https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&api_key=${apiKey}&user_id=${userId}&per_page=${perPage}&page=1&format=json`;
    document.body.appendChild(script1);
  </script>
</body>
</html>
