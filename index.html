<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625@N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    // This function catches the data coming directly from Flickr's public stream
    function jsonFlickrFeed(data) {
      var items = data.items;
      
      if (!items || items.length === 0) {
        window.location.replace("https://www.flickr.com/photos/185082625@N02/");
        return;
      }

      // Pick a completely random photo from your latest public uploads
      var randomPhoto = items[Math.floor(Math.random() * items.length)];
      var photoUrl = randomPhoto.link;

      // Update the fallback link and redirect instantly
      document.getElementById('fallback-link').href = photoUrl;
      window.location.replace(photoUrl);
    }
  </script>

  <!-- This script tag pulls your live public photos and triggers the function above -->
  <script type="text/javascript" src="https://api.flickr.com/services/feeds/photos_public.gne?id=185082625@N02&format=json"></script>
</body>
</html>
