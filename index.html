<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flickr Archive Shuffler</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #error-box {
      color: #ff5555;
      margin-top: 20px;
      max-width: 600px;
      word-break: break-all;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ CONNECTING TO FLICKR API... ]</div>
  <div id="error-box"></div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625@N02/" style="display:none;">Click here to go to your profile manually.</a>

  <script type="text/javascript">
    (async function() {
      const apiKey = "Y8f55184af0567074bc4fff8e78c66f7f"; // <-- Paste your API key here
      const userId = "185082625@N02";
      const perPage = 250;

      try {
        // Step 1: Request page 1 to get total photo count
        const url = `https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&api_key=${apiKey}&user_id=${userId}&per_page=${perPage}&page=1&format=json&nojsoncallback=1`;
        
        const res = await fetch(url);
        const data = await res.json();

        if (data.stat !== "ok") {
          throw new Error("Flickr API Error: " + (data.message || JSON.stringify(data)));
        }

        const totalPages = data.photos.pages;
        const totalPhotos = data.photos.total;

        document.getElementById('splash').innerText = `[ ARCHIVE LOADED: ${totalPhotos} PHOTOS (${totalPages} PAGES) ]`;

        // Step 2: Pick a truly random page across the entire archive history
        const randomPage = Math.floor(Math.random() * totalPages) + 1;

        // Step 3: Fetch that random page
        const pageUrl = `https://api.flickr.com/services/rest/?method=flickr.people.getPublicPhotos&api_key=${apiKey}&user_id=${userId}&per_page=${perPage}&page=${randomPage}&format=json&nojsoncallback=1`;
        
        const pageRes = await fetch(pageUrl);
        const pageData = await pageRes.json();

        if (pageData.stat !== "ok" || !pageData.photos.photo.length) {
          throw new Error("Failed to fetch photos from random page " + randomPage);
        }

        const photos = pageData.photos.photo;
        const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
        const photoUrl = `https://www.flickr.com/photos/${userId}/${randomPhoto.id}/`;

        // Step 4: Success! Redirect to the deep archive photo
        document.getElementById('splash').innerText = `[ REDIRECTING TO DEEP ARCHIVE... ]`;
        window.location.replace(photoUrl);

      } catch (err) {
        console.error(err);
        document.getElementById('splash').innerText = "[ ERROR DETECTED ]";
        document.getElementById('error-box').innerText = err.message;
        document.getElementById('fallback-link').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
