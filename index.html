<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <!-- Static fallback link avoids JS DOM creation delay -->
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625%40N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    (function() {
      // Streamlined token pool ensuring heavy-hitting matches on automatic load
      var searchTokens = [
        "p", "pict", "img", "dsc", "dscn",
        "a", "e", "i", "o", "u",
        "1", "2", "3", "4", "5", "6", "7", "8", "9"
      ];
      
      var randomToken = searchTokens[Math.floor(Math.random() * searchTokens.length)];
      var randomSeed = Math.floor(Math.random() * 9999999);
      
      var destination = "https://www.flickr.com/search/?" +
        "user_id=185082625%40N02" +
        "&text=" + encodeURIComponent(randomToken) +
        "&sort=interestingness-desc" +
        "&page=1" +
        "&view_all=1" +
        "&_s=" + randomSeed;

      // Instantly map destination to the static link
      document.getElementById('fallback-link').href = destination;

      // Zero-delay asynchronous redirect
      setTimeout(function() {
        window.location.replace(destination);
      }, 0);
    })();
  </script>
</body>
</html>
