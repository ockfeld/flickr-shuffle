<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffling Photo Archive...</title>
  <style>
    html, body {
      background-color: #0d0d0d !important;
      color: #aeaeae !important;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 1px;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #ffffff !important;
      margin-top: 15px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="splash">[ SHUFFLING PHOTO ARCHIVE... ]</div>
  <a id="fallback-link" href="https://www.flickr.com/photos/185082625%40N02/">Click here if you are not redirected automatically.</a>

  <script type="text/javascript">
    (function() {
      // Set 'maxPage' to the highest page number of your photostream 
      // (You can change this number depending on how deep your archive goes!)
      var maxPage = 20; 
      var randomPage = Math.floor(Math.random() * maxPage) + 1;
      
      // Direct photostream pagination — zero search tokens, zero keyword filtering
      var destination = "https://www.flickr.com/photos/185082625%40N02/page" + randomPage + "/";

      document.getElementById('fallback-link').href = destination;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
